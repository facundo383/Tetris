<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Arcade - Español</title>
  <style>
    /* ==========================================================================
       1. ESTILOS GENERALES Y CONFIGURACIÓN BASE
       ========================================================================== */
    * {
      box-sizing: border-box;
      user-select: none; /* Evita la selección accidental de texto al interactuar */
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 2.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    /* ==========================================================================
       2. ESTRUCTURA Y CONTENEDORES DE LA INTERFAZ
       ========================================================================== */
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 850px;
    }

    .game-layout {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      width: 100%;
      flex-wrap: wrap;
    }

    /* Panel izquierdo: Contadores de Puntos y Nivel/Velocidad */
    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 170px;
      background: #1e293b;
      padding: 20px 15px;
      border-radius: 8px;
      border: 3px solid #334155;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      gap: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }

    .stat-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Contenedor central del lienzo (Canvas) y capas superpuestas */
    .board-container {
      position: relative;
      border: 4px solid #334155;
      border-radius: 8px;
      background-color: #020617;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      overflow: hidden;
    }

    canvas#tetris {
      display: block;
    }

    /* Capas flotantes para PAUSA y GAME OVER */
    .pause-overlay, .game-over-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }

    /* Animación parpadeante del texto PAUSA */
    .pause-text {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ef4444;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.9);
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.95); }
    }

    .game-over-title {
      font-size: 2rem;
      font-weight: 900;
      color: #f43f5e;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
    }

    .game-over-score {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    /* Panel derecho: Vista previa de pieza, botones y controles */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 170px;
    }

    .next-container {
      background-color: #1e293b;
      border: 3px solid #334155;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .next-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #94a3b8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    canvas#next {
      background-color: #020617;
      border: 2px solid #334155;
      border-radius: 6px;
      display: block;
    }

    /* Estilos de botones de interacción */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      color: white;
      border: none;
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(0,0,0,0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-retry { background: #10b981; }
    .btn-retry:hover { background: #059669; }

    .btn-pause { background: #f97316; }
    .btn-pause:hover { background: #ea580c; }

    .btn-speed { background: #0284c7; }
    .btn-speed:hover { background: #0369a1; }

    .btn-reset { background: #64748b; }
    .btn-reset:hover { background: #475569; }

    .controls-box {
      background-color: #1e293b;
      border: 3px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .controls-box h3 {
      margin: 0 0 6px 0;
      font-size: 0.9rem;
      text-transform: uppercase;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
      color: #f1f5f9;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       3. CONTROLES TÁCTILES Y ADAPTATIVIDAD (RESPONSIVE)
       ========================================================================== */
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin-top: 10px;
    }

    .touch-btn {
      background: #1e293b;
      color: white;
      border: 2px solid #334155;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .touch-btn:active {
      background: #334155;
    }

    @media (max-width: 650px) {
      .game-layout {
        flex-direction: column;
        align-items: center;
      }
      .left-panel {
        flex-direction: row;
        justify-content: space-around;
        width: 240px;
      }
      .touch-controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <h1>TETRIS</h1>
  
  <div class="game-wrapper">
    <div class="game-layout">
      <!-- Panel Izquierdo: Puntos y Nivel -->
      <div class="left-panel">
        <div class="stat-box">
          <div class="stat-title">PUNTOS</div>
          <div id="score" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">VELOCIDAD</div>
          <div id="level" class="stat-value">1</div>
        </div>
      </div>

      <!-- Tablero Central -->
      <div class="board-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <!-- Cartel emergente de Pausa -->
        <div id="pauseOverlay" class="pause-overlay">
          <div class="pause-text">PAUSA</div>
        </div>

        <!-- Cartel emergente de Fin de Juego -->
        <div id="gameOverOverlay" class="game-over-overlay">
          <div class="game-over-title">¡JUEGO TERMINADO!</div>
          <div class="game-over-score">Puntuación: <span id="finalScore">0</span></div>
          <button id="modalRetryBtn" class="btn btn-retry" style="padding: 12px 20px; font-size: 1rem;">
            🔄 Jugar de nuevo
          </button>
        </div>
      </div>

      <!-- Panel Derecho: Siguiente pieza y acciones -->
      <div class="right-panel">
        <div class="next-container">
          <div class="next-title">SIGUIENTE</div>
          <canvas id="next" width="100" height="100"></canvas>
        </div>

        <div class="action-buttons">
          <button id="retryBtn" class="btn btn-retry">🔄 Reintentar</button>
          <button id="pauseBtn" class="btn btn-pause">⏸️ Pausar</button>
          <button id="speedBtn" class="btn btn-speed">⚡ Velocidad (+1)</button>
          <button id="resetSpeedBtn" class="btn btn-reset">🔄 Reiniciar Vel.</button>
        </div>

        <div class="controls-box">
          <h3>CONTROLES:</h3>
          ← / → : Mover<br>
          ↑ : Rotar<br>
          ↓ : Bajar rápido<br>
          P / Espacio : Pausar
        </div>
      </div>
    </div>

    <!-- Controles táctiles para móviles -->
    <div class="touch-controls">
      <div class="touch-btn" id="btnLeft">←</div>
      <div class="touch-btn" id="btnRotate">↻</div>
      <div class="touch-btn" id="btnRight">→</div>
      <div class="touch-btn" id="btnDown" style="grid-column: span 3;">↓ Bajar</div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. INICIALIZACIÓN DE ELEMENTOS Y VARIABLES DE CONFIGURACIÓN
       ========================================================================== */
    // Configuración del Canvas Principal (12x20 bloques, escalados por 20px)
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    // Configuración del Canvas Secundario (Vista previa de la siguiente pieza)
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');
    nextContext.scale(20, 20);

    // Referencias a los elementos del DOM
    const pauseOverlay = document.getElementById('pauseOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreSpan = document.getElementById('finalScore');
    const pauseBtn = document.getElementById('pauseBtn');
    const retryBtn = document.getElementById('retryBtn');
    const modalRetryBtn = document.getElementById('modalRetryBtn');
    const speedBtn = document.getElementById('speedBtn');
    const resetSpeedBtn = document.getElementById('resetSpeedBtn');

    // Reglas e intervalos de tiempo
    const ROWS = 20;
    const COLS = 12;
    const POINTS_PER_LINE = 1000;
    const SPEED_STEP_POINTS = 3000; // Sube nivel cada 3000 puntos

    let score = 0;
    let level = 1;
    let dropInterval = 1000; // Tiempo en ms entre cada caída automática
    let lastTime = 0;
    let dropCounter = 0;
    let isPaused = false;
    let isGameOver = false;
    let nextPieceMatrix = null;

    // Paleta de colores para las piezas de Tetris (Tetrominós)
    const COLORS = [
      null,
      '#00f0f0', // 1: Cyan (Pieza I)
      '#0000f0', // 2: Azul (Pieza J)
      '#f0a000', // 3: Naranja (Pieza L)
      '#f0f000', // 4: Amarillo (Pieza O)
      '#00f000', // 5: Verde (Pieza S)
      '#a000f0', // 6: Púrpura (Pieza T)
      '#f00000'  // 7: Rojo (Pieza Z)
    ];

    /* ==========================================================================
       2. CREACIÓN Y DEFINICIÓN DE MATRICES Y PIEZAS
       ========================================================================== */
    // Genera la matriz que representa la forma según la letra
    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'J') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [2, 2, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'S') {
        return [
          [0, 5, 5],
          [5, 5, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 6, 0],
          [6, 6, 6],
          [0, 0, 0],
        ];
      } else if (type === 'Z') {
        return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    // Selecciona una pieza al azar de la lista
    function getRandomPiece() {
      const pieces = 'IJLOSTZ';
      return createPiece(pieces[pieces.length * Math.random() | 0]);
    }

    // Crea una matriz bidimensional llena de ceros (vacía)
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    // Inicializa la matriz principal del campo de juego y el estado del jugador
    let arena = createMatrix(COLS, ROWS);
    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
    };

    /* ==========================================================================
       3. LÓGICA DE DETECCIÓN Y FÍSICAS DEL JUEGO
       ========================================================================== */
    // Verifica si la pieza actual colisiona con las paredes o bloques fijos
    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // Fija los valores de la pieza activa dentro de la matriz del escenario
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // Evalúa si hay filas completas para eliminarlas y suma la puntuación
    function arenaSweep() {
      let linesCleared = 0;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer; // Si encuentra una celda vacía, salta de fila
          }
        }
        // Remueve la fila llena y agrega una nueva fila vacía al inicio
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        linesCleared++;
      }
      if (linesCleared > 0) {
        score += linesCleared * POINTS_PER_LINE;
        updateScoreAndSpeed();
      }
    }

    /* ==========================================================================
       4. GESTIÓN DE PUNTUACIÓN Y AJUSTE DE DIFICULTAD
       ========================================================================== */
    // Recomputa el intervalo de velocidad según el nivel actual
    function recalculateDropInterval() {
      if (level >= 30) {
        dropInterval = 0; // Caída instantánea en nivel 30 o superior
      } else {
        dropInterval = Math.max(50, 1000 * Math.pow(0.85, level - 1));
      }
    }

    // Actualiza los textos de puntuación y revisa incrementos de velocidad
    function updateScoreAndSpeed() {
      document.getElementById('score').innerText = score;
      const calculatedLevel = Math.floor(score / SPEED_STEP_POINTS) + 1;
      if (calculatedLevel > level) {
        level = calculatedLevel;
        document.getElementById('level').innerText = level;
        recalculateDropInterval();
      }
    }

    // Modifica manualmente el nivel por medio de botones
    function increaseSpeedManually() {
      if (isGameOver) return;
      level++;
      document.getElementById('level').innerText = level;
      recalculateDropInterval();
    }

    function resetSpeedManually() {
      if (isGameOver) return;
      level = 1;
      document.getElementById('level').innerText = level;
      recalculateDropInterval();
    }

    /* ==========================================================================
       5. RENDERIZADO Y DIBUJO EN CANVAS
       ========================================================================== */
    // Dibuja la cuadrícula de fondo
    function drawGrid(ctx, width, height) {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 0.05;
      for (let x = 0; x < width; x++) {
        for (let y = 0; y < height; y++) {
          ctx.strokeRect(x, y, 1, 1);
        }
      }
    }

    // Limpia y redibuja la pantalla completa en cada fotograma
    function draw() {
      context.fillStyle = '#020617';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid(context, COLS, ROWS);
      drawMatrix(context, arena, {x: 0, y: 0});
      if (player.matrix) {
        drawMatrix(context, player.matrix, player.pos);
      }
      drawNextPiece();
    }

    // Dibuja la vista previa de la siguiente pieza
    function drawNextPiece() {
      nextContext.fillStyle = '#020617';
      nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      
      drawGrid(nextContext, 5, 5);
      if (nextPieceMatrix) {
        const xOffset = (5 - nextPieceMatrix[0].length) / 2;
        const yOffset = (5 - nextPieceMatrix.length) / 2;
        drawMatrix(nextContext, nextPieceMatrix, {x: xOffset, y: yOffset});
      }
    }

    // Renderiza una matriz específica en las coordenadas indicadas
    function drawMatrix(ctx, matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = COLORS[value];
            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            
            ctx.lineWidth = 0.08;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    /* ==========================================================================
       6. MOVIMIENTOS DEL JUGADOR Y CONTROL DE PARTIDA
       ========================================================================== */
    // Ejecuta la caída descendente de la pieza
    function playerDrop() {
      if (isPaused || isGameOver) return;
      if (level >= 30) {
        // En nivel 30+ cae de golpe hasta el fondo sin animación
        while (!collide(arena, player)) {
          player.pos.y++;
        }
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        dropCounter = 0;
        return;
      }
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    // Mueve la pieza horizontalmente a la izquierda o derecha
    function playerMove(dir) {
      if (isPaused || isGameOver) return;
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    // Carga la siguiente pieza e identifica el estado de Game Over
    function playerReset() {
      if (!nextPieceMatrix) {
        nextPieceMatrix = getRandomPiece();
      }
      
      player.matrix = nextPieceMatrix;
      nextPieceMatrix = getRandomPiece();
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      // Si la pieza nueva choca inmediatamente al aparecer, termina el juego
      if (collide(arena, player)) {
        isGameOver = true;
        finalScoreSpan.innerText = score;
        gameOverOverlay.style.display = 'flex';
      }
    }

    // Reinicia todas las variables para comenzar un nuevo juego
    function restartGame() {
      arena = createMatrix(COLS, ROWS);
      score = 0;
      level = 1;
      isPaused = false;
      isGameOver = false;
      
      pauseOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      
      pauseBtn.innerText = '⏸️ Pausar';
      pauseBtn.style.background = '#f97316';
      nextPieceMatrix = null;
      recalculateDropInterval();
      updateScoreAndSpeed();
      playerReset();
      lastTime = performance.now();
    }

    // Controla la rotación y ajusta el desplazamiento para evitar traspasar límites (Wall Kick)
    function playerRotate(dir) {
      if (isPaused || isGameOver) return;
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir); // Deshace la rotación si no cabe
          player.pos.x = pos;
          return;
        }
      }
    }

    // Transpone e invierte las filas de la matriz para rotarla 90 grados
    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    // Alterna el estado de pausa
    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseOverlay.style.display = 'flex';
        pauseBtn.innerText = '▶️ Reanudar';
        pauseBtn.style.background = '#22c55e';
      } else {
        pauseOverlay.style.display = 'none';
        pauseBtn.innerText = '⏸️ Pausar';
        pauseBtn.style.background = '#f97316';
        lastTime = performance.now();
      }
    }

    /* ==========================================================================
       7. BUCLE PRINCIPAL (GAME LOOP) Y EVENTOS
       ========================================================================== */
    // Ciclo de animación principal sincronizado con la frecuencia del monitor
    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      if (!isPaused && !isGameOver) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
          playerDrop();
        }
      }
      draw();
      requestAnimationFrame(update);
    }

    // Captura de eventos del teclado
    document.addEventListener('keydown', event => {
      if (event.keyCode === 80 || event.keyCode === 32) { // Tecla 'P' o Espacio
        togglePause();
        return;
      }
      if (isPaused || isGameOver) return;
      if (event.keyCode === 37) { // Flecha Izquierda
        playerMove(-1);
      } else if (event.keyCode === 39) { // Flecha Derecha
        playerMove(1);
      } else if (event.keyCode === 40) { // Flecha Abajo
        playerDrop();
      } else if (event.keyCode === 38) { // Flecha Arriba
        playerRotate(1);
      }
    });

    // Escuchadores para botones de la interfaz web
    pauseBtn.addEventListener('click', togglePause);
    retryBtn.addEventListener('click', restartGame);
    modalRetryBtn.addEventListener('click', restartGame);
    speedBtn.addEventListener('click', increaseSpeedManually);
    resetSpeedBtn.addEventListener('click', resetSpeedManually);

    // Escuchadores para controles en dispositivos móviles
    document.getElementById('btnLeft').addEventListener('click', () => playerMove(-1));
    document.getElementById('btnRight').addEventListener('click', () => playerMove(1));
    document.getElementById('btnRotate').addEventListener('click', () => playerRotate(1));
    document.getElementById('btnDown').addEventListener('click', () => playerDrop());

    // Inicio de la aplicación
    restartGame();
    update();
  </script>
</body>
</html>
