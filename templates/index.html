<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Arcade - Perfiles</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 2.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
    }

    /* PANTALLA DE SELECCIÓN DE PERFIL */
    #profile-selection {
      display: block;
      background: #1e293b;
      border: 3px solid #334155;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 550px;
    }

    .profiles-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .profile-card {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      padding: 20px;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .profile-card input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 8px;
      text-align: center;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
    }

    /* PANTALLA DEL JUEGO */
    #game-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 850px;
    }

    .game-layout {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      width: 100%;
      flex-wrap: wrap;
    }

    .left-panel, .right-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 170px;
      gap: 15px;
    }

    .stat-box, .next-container {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      text-align: center;
    }

    .stat-title { font-size: 0.9rem; color: #94a3b8; font-weight: bold; }
    .stat-value { font-size: 1.6rem; color: #38bdf8; font-weight: 800; }

    .board-container {
      position: relative;
      border: 4px solid #334155;
      border-radius: 8px;
      background-color: #020617;
      overflow: hidden;
    }

    canvas#tetris { display: block; }
    canvas#next { background-color: #020617; border: 2px solid #334155; border-radius: 6px; margin: 0 auto; }

    .pause-overlay, .game-over-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.88);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .btn {
      color: white; border: none; padding: 12px 15px;
      font-size: 0.95rem; font-weight: 700; border-radius: 6px;
      cursor: pointer; width: 100%; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-select { background: #10b981; color: #ffffff; }
    .btn-retry { background: #10b981; }
    .btn-pause { background: #f97316; }
    .btn-switch { background: #0284c7; color: #ffffff; }
  </style>
</head>
<body>

  <h1>TETRIS ARCADE</h1>

  <!-- SELECCIÓN DE PERFIL -->
  <div id="profile-selection">
    <h2>Selecciona o Renombra tu Perfil</h2>
    <div class="profiles-container" id="profilesList"></div>
  </div>

  <!-- JUEGO -->
  <div id="game-wrapper">
    <div class="game-layout">
      <!-- Izquierda -->
      <div class="left-panel">
        <div class="stat-box">
          <div class="stat-title">JUGADOR</div>
          <div id="playerNameDisplay" class="stat-value" style="font-size:1.1rem; color:#f59e0b;">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">RÉCORD BD</div>
          <div id="highScoreDisplay" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">PUNTOS</div>
          <div id="score" class="stat-value">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">VELOCIDAD</div>
          <div id="level" class="stat-value">1</div>
        </div>
      </div>

      <!-- Tablero Central -->
      <div class="board-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <div id="pauseOverlay" class="pause-overlay">
          <h2 style="color: #ef4444; font-size: 2rem;">PAUSA</h2>
        </div>

        <div id="gameOverOverlay" class="game-over-overlay">
          <h2 style="color: #f43f5e;">¡GAME OVER!</h2>
          <p>Puntuación final: <span id="finalScore">0</span></p>
          <button id="modalRetryBtn" class="btn btn-retry">🔄 Jugar de nuevo</button>
        </div>
      </div>

      <!-- Derecha -->
      <div class="right-panel">
        <div class="next-container">
          <div class="stat-title" style="margin-bottom:8px;">SIGUIENTE</div>
          <canvas id="next" width="100" height="100"></canvas>
        </div>
        <button id="pauseBtn" class="btn btn-pause">⏸️ Pausar</button>
        <button id="switchProfileBtn" class="btn btn-switch">👤 Cambiar Perfil</button>
      </div>
    </div>
  </div>

  <script>
    let activeProfile = null;
    let animId = null;

    async function loadProfiles() {
      try {
        const res = await fetch('/api/perfiles');
        const profiles = await res.json();
        const container = document.getElementById('profilesList');
        container.innerHTML = '';

        profiles.forEach(p => {
          const card = document.createElement('div');
          card.className = 'profile-card';
          card.innerHTML = `
            <input type="text" id="name-${p.id}" value="${p.nombre}">
            <p style="font-size:0.85rem; color:#94a3b8; margin:0;">Récord: <b>${p.max_puntuacion}</b> pts</p>
            <button class="btn btn-select" onclick="selectProfile(${p.id})">▶️ ¡JUGAR!</button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error al cargar perfiles:", err);
      }
    }

    async function selectProfile(id) {
      const nuevoNombre = document.getElementById(`name-${id}`).value;
      
      await fetch('/api/perfil/renombrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, nombre: nuevoNombre })
      });

      const res = await fetch('/api/perfiles');
      const profiles = await res.json();
      activeProfile = profiles.find(p => p.id === id);

      document.getElementById('profile-selection').style.display = 'none';
      document.getElementById('game-wrapper').style.display = 'flex';
      
      document.getElementById('playerNameDisplay').innerText = activeProfile.nombre;
      document.getElementById('highScoreDisplay').innerText = activeProfile.max_puntuacion;

      restartGame();
    }

    document.getElementById('switchProfileBtn').addEventListener('click', () => {
      isPaused = true;
      if (animId) cancelAnimationFrame(animId);
      document.getElementById('game-wrapper').style.display = 'none';
      document.getElementById('profile-selection').style.display = 'block';
      loadProfiles();
    });

    /* MOTOR DEL JUEGO */
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');

    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');

    const ROWS = 20, COLS = 12;
    const POINTS_PER_LEVEL = 1000; // Incrementa velocidad cada 1000 puntos

    let score = 0, level = 1, dropInterval = 1000, lastTime = 0, dropCounter = 0;
    let isPaused = false, isGameOver = false, nextPieceMatrix = null;

    const COLORS = [null, '#00f0f0', '#0000f0', '#f0a000', '#f0f000', '#00f000', '#a000f0', '#f00000'];

    function createPiece(type) {
      if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
      if (type === 'J') return [[0,2,0],[0,2,0],[2,2,0]];
      if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
      if (type === 'O') return [[4,4],[4,4]];
      if (type === 'S') return [[0,5,5],[5,5,0],[0,0,0]];
      if (type === 'T') return [[0,6,0],[6,6,6],[0,0,0]];
      if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    let arena = createMatrix(COLS, ROWS);
    const player = { pos: {x: 0, y: 0}, matrix: null };

    function collide(arena, player) {
      const m = player.matrix, o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
        });
      });
    }

    // Calcula y actualiza el nivel e intervalo de velocidad según los puntos alcanzados
    function updateSpeedSettings() {
      level = Math.floor(score / POINTS_PER_LEVEL) + 1;
      document.getElementById('level').innerText = level;

      if (level >= 30) {
        dropInterval = 0; // Caída instantánea a partir del Nivel 30
      } else {
        dropInterval = Math.max(30, 1000 * Math.pow(0.85, level - 1));
      }
    }

    function arenaSweep() {
      let linesCleared = 0;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        linesCleared++;
      }
      if (linesCleared > 0) {
        score += linesCleared * 1000;
        document.getElementById('score').innerText = score;
        updateSpeedSettings();
      }
    }

    function draw() {
      context.fillStyle = '#020617';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(context, arena, {x: 0, y: 0});
      if (player.matrix) drawMatrix(context, player.matrix, player.pos);
      
      nextContext.fillStyle = '#020617';
      nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (nextPieceMatrix) drawMatrix(nextContext, nextPieceMatrix, {x: 1, y: 1});
    }

    function drawMatrix(ctx, matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = COLORS[value];
            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            ctx.lineWidth = 0.08;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function playerDrop() {
      if (isPaused || isGameOver) return;

      // Si alcanzamos nivel 30 o más, la pieza cae directamente al fondo de forma instantánea
      if (level >= 30) {
        while (!collide(arena, player)) {
          player.pos.y++;
        }
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        dropCounter = 0;
        return;
      }

      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      if (isPaused || isGameOver) return;
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
    }

    async function playerReset() {
      const pieces = 'IJLOSTZ';
      if (!nextPieceMatrix) nextPieceMatrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      
      player.matrix = nextPieceMatrix;
      nextPieceMatrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        isGameOver = true;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverOverlay').style.display = 'flex';
        
        if (activeProfile) {
          const res = await fetch('/api/puntuacion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: activeProfile.id, score: score })
          });
          const data = await res.json();
          if (data.nuevo_record) {
            alert("¡Felicidades! Guardaste un nuevo récord en la base de datos.");
            document.getElementById('highScoreDisplay').innerText = score;
          }
        }
      }
    }

    function playerRotate() {
      if (isPaused || isGameOver) return;
      const pos = player.pos.x;
      let offset = 1;
      
      for (let y = 0; y < player.matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [player.matrix[x][y], player.matrix[y][x]] = [player.matrix[y][x], player.matrix[x][y]];
        }
      }
      player.matrix.forEach(row => row.reverse());

      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          player.pos.x = pos;
          return;
        }
      }
    }

    function restartGame() {
      context.setTransform(1, 0, 0, 1, 0, 0);
      context.scale(20, 20);
      nextContext.setTransform(1, 0, 0, 1, 0, 0);
      nextContext.scale(20, 20);

      arena = createMatrix(COLS, ROWS);
      score = 0;
      level = 1;
      isPaused = false;
      isGameOver = false;
      dropCounter = 0;
      
      document.getElementById('score').innerText = 0;
      document.getElementById('level').innerText = 1;
      document.getElementById('pauseOverlay').style.display = 'none';
      document.getElementById('gameOverOverlay').style.display = 'none';
      document.getElementById('pauseBtn').innerText = '⏸️ Pausar';

      updateSpeedSettings();
      nextPieceMatrix = null;
      playerReset();
      lastTime = performance.now();

      if (animId) cancelAnimationFrame(animId);
      update();
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (!isPaused && !isGameOver && document.getElementById('game-wrapper').style.display !== 'none') {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
      }

      draw();
      animId = requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
      if (document.getElementById('game-wrapper').style.display === 'none') return;
      if (event.keyCode === 37) playerMove(-1);
      else if (event.keyCode === 39) playerMove(1);
      else if (event.keyCode === 40) playerDrop();
      else if (event.keyCode === 38) playerRotate();
      else if (event.keyCode === 80) {
        togglePause();
      }
    });

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      document.getElementById('pauseOverlay').style.display = isPaused ? 'flex' : 'none';
      document.getElementById('pauseBtn').innerText = isPaused ? '▶️ Reanudar' : '⏸️ Pausar';
      if (!isPaused) lastTime = performance.now();
    }

    document.getElementById('modalRetryBtn').addEventListener('click', restartGame);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    loadProfiles();
  </script>
</body>
</html>
